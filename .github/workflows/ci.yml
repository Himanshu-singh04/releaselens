name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check repository and policy tests
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Bounded B0b research vectors (runner Python, not target qualification)
        run: |
          mkdir -p "$RUNNER_TEMP/b0b-wheel"
          curl --fail --silent --show-error --proto '=https' --max-time 60 \
            https://files.pythonhosted.org/packages/4d/78/119878110660b2ad709888c8a1614fce7e2fab39080ab960656dc8605bf6/rfc8785-0.1.4-py3-none-any.whl \
            --output "$RUNNER_TEMP/b0b-wheel/rfc8785-0.1.4-py3-none-any.whl"
          python3 -I -B research/b0b/offline.py \
            "$RUNNER_TEMP/b0b-wheel/rfc8785-0.1.4-py3-none-any.whl" "$RUNNER_TEMP/b0b-run"
      - name: B2 Contract tests (hosted runner, not exact Mac evidence)
        run: |
          mkdir -p "$RUNNER_TEMP/b2"/{home,tmp,cache,config}
          status=0
          (
            ulimit -f 1024
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/b2/home" \
              TMPDIR="$RUNNER_TEMP/b2/tmp" TEMP="$RUNNER_TEMP/b2/tmp" TMP="$RUNNER_TEMP/b2/tmp" \
              XDG_CACHE_HOME="$RUNNER_TEMP/b2/cache" XDG_CONFIG_HOME="$RUNNER_TEMP/b2/config" \
              PYTHONDONTWRITEBYTECODE=1 LC_ALL=C PIP_CONFIG_FILE=/dev/null \
              PIP_DISABLE_PIP_VERSION_CHECK=1 \
              timeout --signal=TERM --kill-after=2s 180s \
              "$RUNNER_TEMP/b0b-run/.venv/bin/python" -I -B tests/test_contract.py
          ) > "$RUNNER_TEMP/b2/stdout" 2> "$RUNNER_TEMP/b2/stderr" || status=$?
          cat "$RUNNER_TEMP/b2/stdout" "$RUNNER_TEMP/b2/stderr"
          exit "$status"
      - name: Validate workflow syntax
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  pr-record:
    name: pr-record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch PR commit metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" > "$RUNNER_TEMP/commits.json"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate PR evidence and attribution
        run: python3 scripts/check_pr.py "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/commits.json"
